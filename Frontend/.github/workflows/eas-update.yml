name: EAS Update
on:
  push:
    branches: [main]
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install -g eas-cli
      - run: npx eas update --branch main --auto
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
